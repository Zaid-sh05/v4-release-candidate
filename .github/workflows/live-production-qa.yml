name: Qanoni Live Production QA

on:
  push:
    branches: [qa/live-railway-v4]
  pull_request:
  workflow_dispatch:

jobs:
  live-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      QANONI_BASE_URL: https://qanoni-alurdoni.up.railway.app
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run live production QA
        run: python scripts/live_production_qa.py
