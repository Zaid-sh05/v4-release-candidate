name: Qanoni V4 Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      RUNTIME_STORE: sqlite
      OPENAI_API_KEY: ""
      GROQ_API_KEY: ""
      COGNITION_LLM_PROVIDER: off
      SUPABASE_URL: ""
      SUPABASE_SERVICE_ROLE_KEY: ""
      ADMIN_API_KEY: ""
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Verify app import
        run: python -c "import app; import app.cognition; print('Qanoni app import OK')"

      - name: Validate frontend JavaScript
        run: |
          node --check static/app.js
          node --check static/feedback-review.js
          node --check static/sw.js

      - name: Run cognition regression tests
        run: |
          python -m pytest -q \
            tests/test_cognition.py \
            tests/test_conversation_cognition.py \
            tests/test_cognition_v2.py \
            tests/test_cognition_v21.py \
            tests/test_llm_cognition.py \
            tests/test_cognition_torture_contract.py \
            tests/test_case_analysis_bilingual.py \
            tests/test_conversation_threading.py

      - name: Run lawyer scenario torture suite
        run: |
          python -m pytest -q \
            tests/test_lawyer_torture_suite.py \
            tests/test_lawyer_fact_only_analysis.py \
            tests/test_lawyer_domain_expansion_v5.py

      - name: Run V3 regression tests
        run: |
          python -m pytest -q \
            tests/test_repository.py \
            tests/test_router.py \
            tests/test_no_emoji.py \
            tests/test_ui_invariants.py \
            tests/test_v34_adaptive.py \
            tests/test_v35_context.py \
            tests/test_pilot_acceptance.py \
            tests/test_burglary_regression.py

      - name: Run legal updater safety tests
        run: python -m pytest -q tests/test_legal_update_guard.py tests/test_cloud_updater.py

      - name: Run grounded feedback correction tests
        run: python -m pytest -q tests/test_feedback_self_correction.py

      - name: Run observability and cloud read-path tests
        run: python -m pytest -q tests/test_observability.py tests/test_cloud_read_paths.py

      - name: Run OpenAI grounded writer contracts
        run: python -m pytest -q tests/test_openai_grounded_writer.py

      - name: Run API smoke test
        run: python -m pytest -q tests/test_api_smoke.py
